# Continuous Delivery: build and publish on version tags (v*).
#
# 1. create-release — open the GitHub Release with generated notes
# 2. binaries       — static linux binaries (amd64 + arm64 musl) via
#                     cargo-zigbuild, attached as release assets
# 3. image          — multi-arch container image pushed to GHCR
#
# Uses only the built-in GITHUB_TOKEN; no external secrets required.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        run: gh release create "$TAG" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}

  binaries:
    name: Binaries (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Static musl builds match the alpine runtime image; rdkafka's
        # optional `ssl` feature is off by default so no OpenSSL is needed.
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release-${{ matrix.target }}
      - name: Install protoc, cmake, libcurl headers
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake libcurl4-openssl-dev
      - name: Build (zigbuild)
        run: cargo zigbuild --release --target ${{ matrix.target }} --bin rs-broker
      - name: Package
        run: |
          dir="rs-broker-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$dir"
          cp target/${{ matrix.target }}/release/rs-broker "$dir/"
          cp -r config migrations "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rs-broker-*.tar.gz
            rs-broker-*.tar.gz.sha256

  image:
    name: Container image (GHCR)
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: tags
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DATABASE_FEATURE=postgres
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
