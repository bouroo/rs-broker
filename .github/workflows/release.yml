# Continuous Delivery: build and publish on version tags (v*).
#
# 1. create-release — open the GitHub Release with generated notes
# 2. binaries       — static linux binaries (amd64 + arm64 musl) via
#                     cargo-zigbuild, attached as release assets
# 3. image          — multi-arch container image pushed to GHCR
#
# Uses only the built-in GITHUB_TOKEN; no external secrets required.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        run: gh release create "$TAG" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}

  binaries:
    name: Binaries (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Static musl builds match the alpine runtime image; rdkafka's
        # optional `ssl` feature is off by default so no OpenSSL is needed.
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install zig (required by cargo-zigbuild)
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release-${{ matrix.target }}
      # NOTE: no host libcurl here — cross-compiled librdkafka must not pick
      # up the host (glibc) curl; cmake then disables WITH_CURL (optional
      # feature, unused by this workspace) and the musl build stays static.
      - name: Install protoc and cmake
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake
      - name: Build (zigbuild)
        run: cargo zigbuild --release --target ${{ matrix.target }} --bin rs-broker
      - name: Package
        run: |
          dir="rs-broker-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$dir"
          cp target/${{ matrix.target }}/release/rs-broker "$dir/"
          cp -r config migrations "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rs-broker-*.tar.gz
            rs-broker-*.tar.gz.sha256

  # Build each platform natively in parallel (no QEMU emulation — the arm64
  # Rust release build takes 90+ min under emulation vs ~10 min native), push
  # by digest, then merge the digests into one multi-arch manifest.
  image-build:
    name: Image build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: create-release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            DATABASE_FEATURE=postgres
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.platform }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          echo "${digest#sha256:}" > "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image-merge:
    name: Image merge (manifest)
    runs-on: ubuntu-latest
    needs: image-build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: tags
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/${{ github.repository }}:${{ github.ref_name }}" \
            -t "ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.version }}" \
            -t "ghcr.io/${{ github.repository }}:latest" \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
      - name: Inspect manifest
        run: docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
